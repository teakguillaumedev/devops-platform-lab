apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k05
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tshoot-k05
spec:
  replicas: 2
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tshoot-k05
spec:
  selector: {app: api}
  ports:
    - port: 80
      targetPort: 8080
