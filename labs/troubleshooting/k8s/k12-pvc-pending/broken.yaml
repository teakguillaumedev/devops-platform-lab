apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k12
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: tshoot-k12
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: fast-ssd
  resources:
    requests: {storage: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: tshoot-k12
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: notes}
  template:
    metadata:
      labels: {app: notes}
    spec:
      containers:
        - name: notes
          image: busybox:1.36
          command: ["sh", "-c", "date >> /data/boot.log; echo \"notes up, $(wc -l < /data/boot.log) boot(s) recorded\"; while true; do sleep 3600; done"]
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: data}
