apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k10-data
---
apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k10-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tshoot-k10-data
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tshoot-k10-data
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tshoot-k10-app
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          env:
            - name: BACKEND_URL
              value: http://api
          command: ["sh", "-c", "while true; do if wget -qO- -T 3 \"$BACKEND_URL\" >/dev/null; then echo \"frontend: $BACKEND_URL OK\"; else echo \"frontend: $BACKEND_URL FAILED\"; fi; sleep 5; done"]
