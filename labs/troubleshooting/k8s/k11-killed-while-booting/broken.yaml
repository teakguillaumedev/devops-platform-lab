apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k11
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy
  namespace: tshoot-k11
spec:
  replicas: 1
  selector:
    matchLabels: {app: legacy}
  template:
    metadata:
      labels: {app: legacy}
    spec:
      containers:
        - name: legacy
          image: busybox:1.36
          command: ["sh", "-c", "echo 'warming up (45s)...'; sleep 45; touch /tmp/healthy; echo 'legacy is up'; while true; do sleep 3600; done"]
          readinessProbe:
            exec: {command: ["cat", "/tmp/healthy"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["cat", "/tmp/healthy"]}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
