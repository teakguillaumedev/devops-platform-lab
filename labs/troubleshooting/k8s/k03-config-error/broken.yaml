apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k03
---
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: tshoot-k03
type: Opaque
stringData:
  username: shop
  password: s3cr3t-from-dba
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tshoot-k03
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sh", "-c", "echo connecting as $DB_USER; while true; do sleep 3600; done"]
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef: {name: db-credentials, key: username}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: db-credentials, key: db-password}
