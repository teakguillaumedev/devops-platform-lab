apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k02
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: tshoot-k02
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              if [ -z "$APP_MODE" ]; then echo "FATAL: APP_MODE is not set" >&2; exit 1; fi
              echo "worker started in $APP_MODE mode"
              while true; do sleep 3600; done
          env:
            - name: APP_MOD
              value: production
