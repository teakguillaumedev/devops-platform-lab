apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k06
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: tshoot-k06
spec:
  replicas: 2
  selector:
    matchLabels: {app: shop}
  template:
    metadata:
      labels: {app: shop}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            periodSeconds: 5
