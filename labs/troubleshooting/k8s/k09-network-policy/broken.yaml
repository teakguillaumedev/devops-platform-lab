apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k09
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tshoot-k09
spec:
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: tshoot-k09
spec:
  selector: {app: backend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tshoot-k09
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: busybox:1.36
          command: ["sh", "-c", "while true; do if wget -qO- -T 3 http://backend >/dev/null; then echo 'frontend: backend OK'; else echo 'frontend: backend FAILED'; fi; sleep 5; done"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: tshoot-k09
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend
  namespace: tshoot-k09
spec:
  podSelector:
    matchLabels: {app: backend}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: front}
      ports:
        - port: 80
