apiVersion: v1
kind: Namespace
metadata:
  name: tshoot-k07
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-renderer
  namespace: tshoot-k07
spec:
  replicas: 1
  selector:
    matchLabels: {app: pdf-renderer}
  template:
    metadata:
      labels: {app: pdf-renderer}
    spec:
      containers:
        - name: renderer
          image: busybox:1.36
          command: ["sh", "-c", "echo renderer ready; while true; do sleep 3600; done"]
          resources:
            requests: {cpu: "16", memory: 32Gi}
            limits: {cpu: "16", memory: 32Gi}
